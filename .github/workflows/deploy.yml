name: Deploy to EC2

# Trigger khi merge vào main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Validate secrets
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "Error: EC2_HOST secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_USERNAME }}" ]; then
            echo "Error: EC2_USERNAME secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_PRIVATE_KEY }}" ]; then
            echo "Error: EC2_PRIVATE_KEY secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.AIRFLOW_PROJECT_PATH }}" ]; then
            echo "Error: AIRFLOW_PROJECT_PATH secret not set"
            exit 1
          fi
          echo "All secrets are configured"

      # Step 3: Test SSH connection
      - name: Test SSH connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            echo "SSH connection successful"
            whoami
            pwd

      # Step 4: Pull latest code
      - name: Pull latest code from main
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd ${{ secrets.AIRFLOW_PROJECT_PATH }}
            echo "Current directory: $(pwd)"
            git fetch origin
            git pull origin main
            echo "Code pulled successfully"

      # Step 5: Verify deployment
      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd ${{ secrets.AIRFLOW_PROJECT_PATH }}
            echo "Deployment completed successfully"
            echo "Project path: $(pwd)"
            echo "Latest commit: $(git log -1 --oneline)"
            # Note: airflow standalone tự động reload DAGs sau khi code thay đổi
