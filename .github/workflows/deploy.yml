name: Deploy Airflow DAGs to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code (để log & trace)
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Validate required secrets
      - name: Validate secrets
        run: |
          set -e
          : "${{ secrets.EC2_HOST }}"
          : "${{ secrets.EC2_USERNAME }}"
          : "${{ secrets.EC2_PRIVATE_KEY }}"
          : "${{ secrets.AIRFLOW_PROJECT_PATH }}"
          echo "✅ All required secrets are set"

      # Step 3: Test SSH connection to EC2
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            echo "✅ SSH connected"
            whoami
            pwd

      # Step 4: Pull latest code on EC2 (MAIN STEP)
      - name: Pull latest code from main
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.AIRFLOW_PROJECT_PATH }}

            echo "📂 Current directory:"
            pwd

            echo "📌 Git status:"
            git status

            echo "⬇️ Pulling latest code from main..."
            git pull origin main

            echo "✅ Code pulled successfully"

      # Step 5: Verify DAGs & Airflow reload
      - name: Verify Airflow DAGs
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            echo "📂 Project path:"
            cd ${{ secrets.AIRFLOW_PROJECT_PATH }}
            pwd

            echo "🧾 Latest commit:"
            git log -1 --oneline

            echo "📁 DAG files:"
            ls dags || true

            echo "ℹ️ Airflow will auto-reload DAGs (standalone mode)"
