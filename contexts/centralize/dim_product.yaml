postgres:
  conn_id: supermarket
  target:
    schema: centralize
    table: dim_product
    based_on: fact_order # add based_on for dim table.
    date_column: order_date # getting max date from this column for backfill logic.
    # start_date and end_date for filter backfill logic.
    # Note: Not for sql in this context.
    start_date: 2016-09-04
    end_date: 2018-10-17

query:
  function: 
    create: create table if not exists {{ schema }}.{{ table }} as
    insert: insert into {{ schema }}.{{ table }}
  sql: |
    select distinct p.product_id
         , p.product_category_name as category_name
         , p.product_weight_g as weight_g
         , p.product_length_cm as length_cm
         , p.product_height_cm as height_cm
         , p.product_width_cm as width_cm
    from public.products p 
    where p.product_id in (
      select distinct product_id 
      from centralize.fact_order_item
    )