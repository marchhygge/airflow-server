postgres:
  conn_id: supermarket
  target:
    schema: centralize
    table: dim_user_test
    based_on: fact_order # add based_on for dim table.
    date_column: order_date # getting max date from this column for backfill logic.
    # Note: Not for sql in this context.
    start_date: 2016-09-04 # start_date and end_date for filter backfill logic.
    end_date: 2018-10-17

query:
  function: 
    create: create table if not exists {{ schema }}.{{ table }} as
    insert: insert into {{ schema }}.{{ table }}
  sql: |
    select distinct 'customer' as user_type
         , c.customer_id as user_id
         , c.customer_unique_id as user_unique_id
         , c.customer_city as city
         , c.customer_state as state
    from public.customers c
    left join public.orders o 
        on o.customer_id = c.customer_id
        and date(o.order_purchase_timestamp) >='{{start_date}}'	
          and date(o.order_purchase_timestamp) < '{{end_date}}'
    union
    select distinct 'seller' as user_type
         , s.seller_id as user_id
         , null as user_unique_id
         , s.seller_city as city
         , s.seller_state as state
    from public.sellers s 
    left join public.order_items oi on oi.seller_id = s.seller_id
    left join public.orders o 
        on o.order_id = oi.order_id
        and date(o.order_purchase_timestamp) >= '{{start_date}}'
        and date(o.order_purchase_timestamp) < '{{end_date}}'