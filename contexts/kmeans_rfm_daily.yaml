postgres:
  conn_id: supermarket

  daily:
    schema: customer_segmentation
    table: rfm_clusters_daily
    query: |
      select c.customer_unique_id
           , ('{end_date}'::date - max(o.order_purchase_timestamp)::date) + 1 as recency
           , count(distinct o.order_id) as frequency
           , sum(op.total_payment) as monetary
      from public.orders o
      inner join public.customers c
          on c.customer_id = o.customer_id
      left join (
          select order_id, sum(payment_value) as total_payment
          from public.order_payments
          group by 1
      ) op
          on op.order_id = o.order_id
      where o.order_purchase_timestamp >= '{start_date}'
        and o.order_purchase_timestamp < '{end_date}'::date + interval '1 day'
      group by 1
      having sum(op.total_payment) > 0

  artifact:
    query: | 
      select artifact_data
        from customer_segmentation.ml_artifacts
        where artifact_name = :artifact_name