postgres:
  conn_id: supermarket
  target:
    schema: report
    table: executive_overview_test
    date_column: order_date # getting max date from this column for backfill logic.
    # start_date and end_date for filter backfill logic.
    # Note: Not for sql in this context.
    start_date: 2016-09-04
    end_date: 2018-10-17

query:
  function: 
    create: create table if not exists {{ schema }}.{{ table }} as
    insert: insert into {{ schema }}.{{ table }}
  sql: |
    select
        o.order_date,
        c.state,
        c.city,
        o.order_status,
        count(distinct o.order_id) as total_order,
        count(distinct oi.order_item_id) as total_product,
        sum(o.total_price) as total_price,
        sum(o.total_payment) as total_revenue,
        count(distinct oi.seller_id) as active_seller,
        count(distinct (case when c.user_type = 'customer' then c.user_unique_id end)) as active_customer
    from centralize.fact_order_test o
    join centralize.fact_order_item_test oi
        on o.order_id = oi.order_id
    left join centralize.dim_user_test c
        on c.user_id = o.customer_id
    left join centralize.dim_product_test dp
        on dp.product_id = oi.product_id
    group by 1,2,3,4