postgres:
  conn_id: supermarket

  training:
    schema: customer_segmentation
    table: rfm_clusters
    start_date: 2016-09-04
    end_date: 2017-02-28
    query: |
      select c.customer_unique_id
           , ('{end_date}'::date - max(o.order_purchase_timestamp)::date) + 1 as recency
           , sum(op.total_payment) as monetary
      from public.orders o
      inner join public.customers c
          on c.customer_id = o.customer_id
      left join (
          select order_id, sum(payment_value) as total_payment
          from public.order_payments
          group by 1
      ) op
          on op.order_id = o.order_id
      where o.order_purchase_timestamp >= '{start_date}'
        and o.order_purchase_timestamp < '{end_date}'::date + interval '1 day'
      group by 1
      having sum(op.total_payment) > 0
        and count(distinct o.order_id) = 1

  artifact:
    query: | 
      insert into customer_segmentation.ml_artifacts (artifact_name, artifact_data, updated_at)
      values (:artifact_name, :artifact_data, :updated_at)
      on conflict (artifact_name) 
      do update set 
        artifact_data = excluded.artifact_data, 
        updated_at = excluded.updated_at
  
  metadata:
    kmeans_training:
      query: |
        insert into customer_segmentation.kmeans_training_log (
          trained_at, start_date, end_date, n_samples,
          n_clusters, inertia, silhouette, n_iter,
          recency_median, monetary_median,
          recency_iqr, monetary_iqr
        )
        values (
          :trained_at, :start_date, :end_date, :n_samples,
          :n_clusters, :inertia, :silhouette, :n_iter,
          :recency_median, :monetary_median,
          :recency_iqr, :monetary_iqr
        )
        returning id

    kmeans_centroid:
      query: |
        insert into customer_segmentation.kmeans_centroid_log (
          training_id, cluster_id, cluster_name,
          recency_scaled, monetary_scaled,
          recency_orig, monetary_orig
        )
        values (
          :training_id, :cluster_id, :cluster_name,
          :recency_scaled, :monetary_scaled,
          :recency_orig, :monetary_orig
        )



