postgres:
  conn_id: supermarket

  training:
    schema: customer_segmentation
    table: rfm_clusters
    start_date: 2016-09-04
    end_date: 2017-02-28
    snapshot_date: 2017-02-28
    window_days: 30
    n_clusters: 3
    query: |
      SELECT
        c.customer_unique_id,
        DATE(o.order_purchase_timestamp)   AS event_date,
        SUM(p.payment_value)               AS revenue
      FROM orders o
      JOIN customers c
          ON o.customer_id = c.customer_id
      JOIN order_payments p
          ON o.order_id = p.order_id
      WHERE
          o.order_status NOT IN ('canceled', 'unavailable')
          AND DATE(o.order_purchase_timestamp) >= '{start_date}'
          AND DATE(o.order_purchase_timestamp) <= '{end_date}'
      GROUP BY
          c.customer_unique_id,
          DATE(o.order_purchase_timestamp)

  artifact:
    query: | 
      insert into customer_segmentation.ml_artifacts (artifact_name, artifact_data, updated_at)
      values (:artifact_name, :artifact_data, :updated_at)
      on conflict (artifact_name) 
      do update set 
        artifact_data = excluded.artifact_data, 
        updated_at = excluded.updated_at
  
  metadata:
    kmeans_training:
      query: |
        insert into customer_segmentation.kmeans_training_log (
          trained_at, start_date, end_date, n_samples,
          n_clusters, inertia, silhouette, n_iter,
          recency_median, frequency_median, monetary_median,
          recency_iqr, frequency_iqr, monetary_iqr
        )
        values (
          :trained_at, :start_date, :end_date, :n_samples,
          :n_clusters, :inertia, :silhouette, :n_iter,
          :recency_median, :frequency_median, :monetary_median,
          :recency_iqr, :frequency_iqr, :monetary_iqr
        )
        returning id

    kmeans_centroid:
      query: |
        insert into customer_segmentation.kmeans_centroid_log (
          training_id, cluster_id, cluster_name,
          recency_scaled, frequency_scaled, monetary_scaled,
          recency_orig, frequency_orig, monetary_orig
        )
        values (
          :training_id, :cluster_id, :cluster_name,
          :recency_scaled, :frequency_scaled, :monetary_scaled,
          :recency_orig, :frequency_orig, :monetary_orig
        )



